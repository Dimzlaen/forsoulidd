<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harapanku Untuk Kalian</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #cbe3f3 0%, #e2eff7 50%, #f6fbff 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
        }

        /* Background texture / soft cloud effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Main Content Center */
        .hero-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
            width: 100%;
            max-width: 850px;
            padding: 0 20px;
        }

        /* Container untuk Video dengan Ukuran Setara Frame Photo */
        .video-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .video-container {
            width: 210px;
            height: 240px;
            background: #ffffff;
            padding: 8px 8px 25px 8px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        .video-container .filename {
            position: absolute;
            bottom: 6px;
            left: 10px;
            font-size: 10px;
            color: #888;
            font-family: monospace;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 6vw, 5.5rem);
            font-weight: 600;
            line-height: 1.05;
            color: #1a1a1a;
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Highlight background box under main title */
        .hero-title::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: -10px;
            right: -10px;
            height: 45%;
            background-color: #ffe66d;
            z-index: -1;
            opacity: 0.9;
            border-radius: 4px;
        }

        .hero-subtitle {
            font-size: clamp(0.9rem, 1.6vw, 1.15rem);
            color: #2c3e50;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: -0.2px;
            max-width: 500px;
            margin: 0 auto;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        /* Floating Photo Cards */
        .photo-card {
            position: absolute;
            background: #ffffff;
            padding: 8px 8px 25px 8px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 10;
        }

        .photo-card:hover, .video-container:hover {
            transform: scale(1.03) rotate(0deg) !important;
            z-index: 99;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        .photo-card .filename {
            position: absolute;
            bottom: 6px;
            left: 10px;
            font-size: 10px;
            color: #888;
            font-family: monospace;
        }

        /* Layout Penempatan Foto */
        .card-1 { top: 12%; left: 8%; width: 210px; height: 240px; transform: rotate(-4deg); }
        .card-2 { bottom: 12%; left: 12%; width: 150px; height: 180px; transform: rotate(6deg); }
        .card-3 { bottom: 8%; left: 25%; width: 140px; height: 160px; transform: rotate(-2deg); }
        .card-4 { top: 15%; right: 12%; width: 200px; height: 220px; transform: rotate(5deg); }
        .card-5 { bottom: 10%; right: 15%; width: 220px; height: 250px; transform: rotate(-5deg); }
        .card-6 { top: 42%; right: 6%; width: 160px; height: 190px; transform: rotate(3deg); }
        .card-7 { top: 40%; left: 6%; width: 150px; height: 170px; transform: rotate(-7deg); }
    </style>
</head>
<body>

    <!-- Main Title, Video Group & Subtitle Section -->
    <div class="hero-center">
        <!-- Kotak Video Bergaya Frame Polaroid di Atas Judul -->
        <div class="video-group">
            <div class="video-container" style="transform: rotate(-3deg);">
                <video autoplay muted loop playsinline>
                    <source src="https://assets.mixkit.co/videos/preview/mixkit-set-of-plateaus-seen-from-the-sky-in-a-sunset-41656-large.mp4" type="video/mp4">
                </video>
                <span class="filename">video_01.mp4</span>
            </div>
            <div class="video-container" style="transform: rotate(3deg);">
                <video autoplay muted loop playsinline>
                    <source src="https://assets.mixkit.co/videos/preview/mixkit-aerial-view-of-city-traffic-at-night-41582-large.mp4" type="video/mp4">
                </video>
                <span class="filename">video_02.mp4</span>
            </div>
        </div>

        <h1 class="hero-title">Harapanku<br>Untuk Kalian</h1>
        <p class="hero-subtitle">Semoga kebersamaan kita terus berlanjut, Doaku agar kalian sukses dalam setiap rencana kalian.</p>
    </div>

    <!-- Floating Photos -->
    <div class="photo-card card-1">
        <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80" alt="Moment 1">
        <span class="filename">memory_01.jpg</span>
    </div>

    <div class="photo-card card-2">
        <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=500&q=80" alt="Moment 2">
        <span class="filename">details.jpg</span>
    </div>

    <div class="photo-card card-3">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=500&q=80" alt="Moment 3">
        <span class="filename">teamwork.jpg</span>
    </div>

    <div class="photo-card card-4">
        <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=500&q=80" alt="Moment 4">
        <span class="filename">slay.png</span>
    </div>

    <div class="photo-card card-5">
        <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=500&q=80" alt="Moment 5">
        <span class="filename">vibes.png</span>
    </div>

    <div class="photo-card card-6">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=500&q=80" alt="Moment 6">
        <span class="filename">portrait.jpg</span>
    </div>

    <div class="photo-card card-7">
        <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=500&q=80" alt="Moment 7">
        <span class="filename">gathering.jpg</span>
    </div>

</body>
</html>
